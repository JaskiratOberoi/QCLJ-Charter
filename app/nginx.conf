server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Unauthenticated probe for the Caddy health check.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
    # Login check: 200 with valid lab credentials, 401 otherwise. empty_gif is a content
    # handler, so it runs after auth_basic (a bare "return" would run before it and skip auth).
    location = /auth/check {
        auth_basic "QCLJ Studio";
        auth_basic_user_file /etc/nginx/htpasswd;
        add_header Cache-Control "no-store";
        empty_gif;
    }
    # The lab record is only served to a signed-in lab.
    location /data/ {
        auth_basic "QCLJ Studio";
        auth_basic_user_file /etc/nginx/htpasswd;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Hashed assets are immutable; the shell is not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
