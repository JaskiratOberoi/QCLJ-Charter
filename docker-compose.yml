# Production: QCLJ Studio record + static fallback on 127.0.0.1:3160, fronted by the
# host Caddy as api-qclj.stellarinfomatica.com. Redeploy: docker compose up -d --build
# Logins live in deploy/htpasswd (git-ignored, see deploy/htpasswd.example).
services:
  web:
    build: ./app
    image: qclj-charter-web
    container_name: qclj-charter-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3160:80"
    volumes:
      - ./deploy/htpasswd:/etc/nginx/htpasswd:ro
